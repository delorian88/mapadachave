<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5EF">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mapa da Chave">
<title>Mapa da Chave</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2C2C2A;--ink2:#5F5E5A;--ink3:#8C8A83;--line:#E4E1D6;--line2:#D3D1C7;--paper:#FFFFFF;--sand:#F7F5EF;--sand2:#EFECE3;--amber:#EF9F27;--amber-d:#BA7517;--amber-l:#FAEEDA;--ok:#2E8B57;--ok-l:#E3F2E8;--warn:#C98A12;--warn-l:#FBF1DA;--bad:#C4422B;--bad-l:#F9E3DE;--r:18px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font:400 15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 8px) 16px calc(96px + var(--sb))}
/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);margin:0 -16px 6px;padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .vt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);flex:none}
.top .vt svg{width:20px;height:20px}
.marca{display:flex;align-items:center;gap:10px;flex:1}
.marca i{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.marca b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.marca small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:-2px}
/* tipografia */
.h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:22px 4px 10px}
.titulo{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.03em;margin:6px 4px 14px}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.esc{background:var(--ink);color:#fff;border-color:var(--ink)}
.card.esc .rot{color:rgba(255,255,255,.62)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rot{font-size:12.5px;color:var(--ink2);font-weight:500}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.mid{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.amb{color:var(--amber)}
/* ferramentas */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:118px;text-align:left;transition:transform .12s}
.tool:active{transform:scale(.97)}
.tool .ic{width:40px;height:40px;border-radius:12px;background:var(--amber-l);display:grid;place-items:center}
.tool .ic svg{width:22px;height:22px;stroke:var(--amber-d)}
.tool b{font-size:14.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.tool small{display:block;font-size:12px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.tool.dest{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:var(--amber-l);border-color:#F2D9AE}
.tool.dest .ic{background:var(--amber)}
.tool.dest .ic svg{stroke:#fff}
/* formulário */
.campos{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.cp{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;border-top:1px solid var(--line)}
.cp:first-child{border-top:0}
.cp label{flex:1;font-size:14.5px;font-weight:500;color:var(--ink)}
.cp .in{display:flex;align-items:center;gap:4px;background:var(--sand);border-radius:12px;padding:0 12px;height:42px;min-width:124px;max-width:54%;border:1.5px solid transparent;transition:border-color .15s}
.cp .in:focus-within{border-color:var(--amber);background:#fff}
.cp .in span{font-size:13.5px;color:var(--ink3);font-weight:500;flex:none}
.cp input{border:0;background:transparent;outline:0;width:100%;text-align:right;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cp input[type=text].tx{text-align:left;font-weight:500}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);padding:0 12px;white-space:nowrap}
.seg.rola{overflow-x:auto;scrollbar-width:none}.seg.rola::-webkit-scrollbar{display:none}.seg.rola button{flex:none}.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.abre{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;font-size:14px;font-weight:600;color:var(--ink2)}
.abre svg{width:18px;height:18px;transition:transform .2s}
.abre.on svg{transform:rotate(180deg)}
.mais{display:none}.mais.on{display:block}
/* resultado */
.res{display:flex;flex-direction:column;gap:12px}
.lin{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lin:first-child{border-top:0;padding-top:2px}
.lin span{color:var(--ink2);font-size:14px}
.lin b{font-size:15.5px;font-weight:700;text-align:right}
.lin.tot b{font-size:18px}
.card.esc .lin{border-color:rgba(255,255,255,.12)}
.card.esc .lin span{color:rgba(255,255,255,.66)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px}
.selo.ok{background:var(--ok-l);color:var(--ok)}.selo.warn{background:var(--warn-l);color:var(--warn)}.selo.bad{background:var(--bad-l);color:var(--bad)}
.card.esc .lin span.selo.ok{color:var(--ok)}.card.esc .lin span.selo.warn{color:var(--warn)}.card.esc .lin span.selo.bad{color:var(--bad)}.selo i{width:7px;height:7px;border-radius:50%;background:currentColor}
/* barras */
.barra{height:10px;border-radius:99px;background:var(--sand2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--amber);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card.esc .barra{background:rgba(255,255,255,.12)}
.pilha{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;margin:6px 0 12px}
.pilha i{display:block;height:100%;min-width:3px}
.leg{display:grid;grid-template-columns:12px 1fr auto auto;gap:6px 10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.leg i{width:12px;height:12px;border-radius:4px}
.leg span{color:var(--ink2)}
.leg small{color:var(--ink3);width:40px;text-align:right}
/* gráfico */
.graf{width:100%;display:block;overflow:visible}
.graf text{font:600 11px Inter,sans-serif;fill:var(--ink3);font-variant-numeric:tabular-nums}
.graf .vl{fill:var(--ink);font-weight:700;font-size:11.5px}
.dica{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:10px;display:none;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dica b{color:var(--amber)}
/* checklist */
.ck{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.ck:first-child{border-top:0}
.ck .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:-1px;transition:all .15s}
.ck .bx svg{width:14px;height:14px;stroke:#fff;opacity:0}
.ck.on .bx{background:var(--amber);border-color:var(--amber)}
.ck.on .bx svg{opacity:1}
.ck b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.ck.on b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.ck small{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
/* três estados */
.tri{padding:14px 16px;border-top:1px solid var(--line)}
.tri:first-child{border-top:0}
.tri b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:4px}
.tri small{display:block;font-size:13px;color:var(--ink2);margin-bottom:10px}
.tri .seg button.on.s{background:var(--ok);color:#fff}.tri .seg button.on.n{background:var(--bad);color:#fff}.tri .seg button.on.q{background:var(--warn);color:#fff}
/* etapas */
.etp{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.etp .nm{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--sand);color:var(--ink2);position:relative}
.etp.ok .nm{background:var(--amber);color:#fff}
.etp .tx{flex:1;min-width:0}
.etp b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.etp small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.etp .mini{height:4px;border-radius:9px;background:var(--sand2);margin-top:8px;overflow:hidden}
.etp .mini i{display:block;height:100%;background:var(--amber)}
.chev{width:18px;height:18px;stroke:var(--ink3);flex:none}
/* avisos de conteúdo */
.nota{border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.45;margin-bottom:12px}
.nota b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.nota.am{background:var(--amber-l);color:#7A4E0E}
.nota.vm{background:var(--bad-l);color:#7E2A1B}
.nota.cz{background:var(--sand2);color:var(--ink2)}
/* botões */
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:15px;font-weight:700;font-size:15px;width:100%;background:var(--ink);color:#fff;transition:transform .12s}
.bt:active{transform:scale(.98)}
.bt.cl{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.bt.am{background:var(--amber);color:#fff}
.bt svg{width:19px;height:19px}
.lado{display:flex;gap:10px}
/* lista de imóveis */
.imv{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;width:100%;text-align:left}
.imv .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.imv b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.imv .nt{font-weight:800;font-size:15px;background:var(--amber-l);color:var(--amber-d);border-radius:10px;padding:4px 9px;flex:none}
.imv .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.imv .ch span{font-size:12.5px;background:var(--sand);border-radius:8px;padding:5px 9px;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
.vazio{text-align:center;padding:34px 20px;color:var(--ink3);font-size:14px}
.vazio svg{width:44px;height:44px;stroke:var(--line2);margin-bottom:8px}
/* glossário */
.busca{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:12px}
.busca svg{width:19px;height:19px;stroke:var(--ink3);flex:none}
.busca input{border:0;outline:0;background:transparent;flex:1;font-size:16px}
.gl{padding:14px 16px;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl b{display:block;font-size:15px;font-weight:700}
.gl p{margin:3px 0 0;font-size:14px;color:var(--ink2)}
/* texto pronto */
.txt{white-space:pre-wrap;font-size:14.5px;line-height:1.55;background:var(--sand);border-radius:14px;padding:14px 16px;margin-bottom:12px}
/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sb))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink3)}
.nav a svg{width:24px;height:24px;stroke:currentColor}
.nav a.on{color:var(--ink)}
.nav a.on svg{stroke:var(--amber-d)}
/* folha */
.fundo{position:fixed;inset:0;background:rgba(30,28,24,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sand);border-radius:24px 24px 0 0;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;padding:8px 16px calc(20px + var(--sb));visibility:hidden}
.folha.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.folha .pega{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.folha h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 4px 14px}
.folha>div{max-width:560px;margin:0 auto}
/* aviso */
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:14px;z-index:70;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* anel */
.anel{display:flex;align-items:center;gap:16px}
.anel svg{flex:none}
/* acesso */
.porta{min-height:100dvh;display:grid;place-items:center;padding:24px}
.porta form{width:100%;max-width:360px;text-align:center}
.porta .lg{width:64px;height:64px;border-radius:20px;background:var(--ink);display:grid;place-items:center;margin:0 auto 18px}
.porta h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 22px}
.porta input{width:100%;height:54px;border-radius:15px;border:1.5px solid var(--line2);background:#fff;padding:0 16px;font-size:17px;text-align:center;letter-spacing:.08em;outline:0;margin-bottom:10px}
.porta input:focus{border-color:var(--amber)}
.erro{color:var(--bad);font-size:13.5px;font-weight:600;min-height:20px;margin-top:8px}
.fade{animation:fd .28s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:700px){.wrap{padding-top:24px}.tools{grid-template-columns:1fr 1fr 1fr}.tool.dest{grid-column:1/-1}}
@media print{.nav,.top .vt,.bt{display:none!important}body{background:#fff}.card,.campos{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div class="fundo" id="fundo"></div>
<div class="folha" id="folha"><div><div class="pega"></div><div id="fc"></div></div></div>
<div class="toast" id="toast"></div>
<div class="dica" id="dica"></div>
<script>
'use strict';

function brl(v,c){if(!isFinite(v))return '—';var neg=v<0;v=Math.abs(v);var s=v.toLocaleString('pt-BR',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0});return (neg?'− ':'')+'R$ '+s}
function brlk(v){if(!isFinite(v))return '—';if(Math.abs(v)>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';if(Math.abs(v)>=1e4)return 'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil';return brl(v)}
function num(v,d){return isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:d==null?0:d}):'—'}
function pct(v,d){return isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d})+'%':'—'}
function parse(s){if(typeof s==='number')return s;s=String(s||'').replace(/[R$\s%]/g,'');if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var n=parseFloat(s);return isFinite(n)?n:0}

function dataBR(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):''}

/* ---------- dados ---------- */
var PADRAO={
  renda:6000,liquida:4800,condiptu:450,guardado:15000,fgts:8000,salario:4000,guardo:1000,rend:10,juros:11,prazo:420,cota:80,itbi:2,cart:1.5,aval:3000,comp:30,

  aluguel:1400,reaj:5,valoriz:5,horiz:10,
  moradia:1600,cond:350,iptu:80,luz:160,agua:80,gas:45,net:130,mercado:850,transp:320,saude:0,lazer:300,dividas:0,outros:150,
  incSaldo:180000,incc:6,incMeses:30,
  aRenda:3500,bRenda:3000,aEnt:20000,bEnt:15000
};
var D;
function carrega(){try{D=JSON.parse(localStorage.getItem('mc_app')||'null')}catch(e){D=null}
  D=D||{};D.v=Object.assign({},PADRAO,D.v||{});D.ck=D.ck||{};D.tri=D.tri||{};D.imv=D.imv||[];D.dep=D.dep||[];D.bancos=D.bancos||[{n:'Caixa',j:11,c:11.9,s:'SAC'},{n:'',j:0,c:0,s:'SAC'},{n:'',j:0,c:0,s:'SAC'}];D.enx=D.enx||{};D.cus=D.cus||{};D.ui=D.ui||{}}
function salva(){try{localStorage.setItem('mc_app',JSON.stringify(D))}catch(e){}}
carrega();
var V=function(k){return +D.v[k]||0};

/* ---------- ícones ---------- */
var IC={
 casa:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 grade:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
